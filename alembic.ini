# Dev-time Alembic config, for generating revisions only; runtime
# upgrades go through libertati.migrations.upgrade_to_head, which builds
# its config in code. Autogenerate diffs the metadata in
# src/libertati/schema.py against the database below, so point it at a
# scratch DB already migrated to head, e.g.:
#
#   uv run python -c "from pathlib import Path; \
#       from libertati.migrations import upgrade_to_head; \
#       upgrade_to_head(Path('/tmp/alembic-scratch.db'))"
#   uv run alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = src/libertati/migrations
sqlalchemy.url = sqlite:////tmp/alembic-scratch.db
