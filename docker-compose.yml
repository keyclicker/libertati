services:
  libertati:
    build: .
    image: ghcr.io/keyclicker/libertati:latest
    restart: unless-stopped
    env_file: .env
    environment:
      LIBERTATI_DB_PATH: /data/libertati.db
      LIBERTATI_MEMORY_DIR: /memory
    volumes:
      - ./data:/data
      - ./memory:/memory
      # Edit settings on the server without rebuilding the image:
      - ./config.toml:/app/config.toml:ro
