# Every non-secret setting, listed explicitly — this file is the shipped
# configuration, not a set of overrides. Secrets (bot token, API key) go
# in .env. Any value here can be overridden with a LIBERTATI_* env var,
# e.g. LIBERTATI_LOG_LEVEL=DEBUG.


# ==========================================================
#                         Runtime
# ==========================================================

log_level = "INFO"

# Timezone the agent lives in (event timestamps, wakeup scheduling).
timezone = "Europe/Kyiv"


# ==========================================================
#                         Storage
# ==========================================================

# SQLite database location (all chats/users/messages are stored here).
db_path = "data/libertati.db"

# Directory holding the mind files SOUL.md / MEMORY.md / INBOX.md /
# DREAMS.md (plus soul/ snapshots written before every soul rewrite).
memory_dir = "data/memory"


# ==========================================================
#                     Model & reasoning
# ==========================================================

# Any OpenAI-compatible endpoint works: the OpenAI URL below, or e.g.
# OpenRouter with "https://openrouter.ai/api/v1" and an "openai/…" model.
# (the key goes in LIBERTATI_API_KEY in .env)
base_url = "https://api.openai.com/v1"
model = "gpt-5.6-luna"

# Reasoning effort for reasoning models.
# Allowed (model-dependent): none, minimal, low, medium, high, xhigh, max.
reasoning_effort = "low"

# Reuse hidden reasoning only inside the current event/tool turn. Set to
# "all_turns" for cross-turn reasoning or "auto" for the model default.
# Set to "omit" for providers that do not support reasoning.context.
reasoning_context = "current_turn"

# After a turn settles, remove its reasoning and final-output envelopes
# from the live model window while retaining them in SQLite. Requires
# reasoning_context = "current_turn". This shrinks serialized input but
# can reduce prompt-cache reuse for the completed-turn suffix.
prune_completed_reasoning = false

# Model for the one-shot recall extraction that answers `recall` and
# `summarize_memory` from the mind files.
recall_model = "gpt-5.6-luna"

# Reasoning effort for that extraction call. Recall is a lookup over notes
# already present in its input, so thinking tokens buy little and are paid
# on every call.
recall_reasoning_effort = "none"

# Model used while dreaming.
dream_model = "gpt-5.6-luna"


# ==========================================================
#                      Context window
# ==========================================================

# Cut the window back to context_trim_items once it grows past
# context_max_items. Chunked trims keep the prompt prefix byte-stable,
# avoiding a prefix rewrite on every append. Actual cache hits depend on
# model-specific cache keys and breakpoints.
context_max_items = 300
context_trim_items = 200

# Max model/tool rounds per agent turn (one turn per event batch).
max_rounds = 8


# ==========================================================
#                         Persona
# ==========================================================

# User-editable agent and memory prompts.
prompts_path = "prompts.toml"

# Roleplay hardening: never break the Soul persona, never admit to
# being a bot/assistant, never discuss internals, no free work on
# command.
roleplay = true

# Built-in web search (server-side; needs a real OpenAI endpoint).
web_search = true


# ==========================================================
#                    Chats & presence
# ==========================================================

# Chat approval mode: when true, only chats marked true in chats_path
# reach the agent; new chats are appended there as false for review
# (edits apply live, no restart).
chat_approval = true
chats_path = "data/chats.toml"

# Minutes between heartbeat status events (0 disables, ±20% jitter).
heartbeat_minutes = 5

# Simulated typing speed for outgoing messages, chars/second (0 disables).
typing_chars_per_second = 15.0


# ==========================================================
#                         Dreaming
# ==========================================================

# While the agent sleeps the waking loop pauses and a differently-prompted
# loop wanders, then rewrites MEMORY.md from INBOX.md, writes DREAMS.md and
# may revise SOUL.md. A dream starts after dream_idle_minutes of quiet, or
# when the agent calls the `dream` tool itself. Budget 0 disables it
# entirely and hides the tool.
dream_daily_budget = 4
dream_idle_minutes = 45
dream_cooldown_minutes = 120

# Tool calls required before wake_up is accepted (wake_up counts).
dream_min_steps = 12
dream_max_rounds = 25
