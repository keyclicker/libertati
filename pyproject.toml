[project]
name = "libertati"
version = "0.1.0"
description = "Agentic Telegram bot: one LLM brain living across all chats"
readme = "README.md"
authors = [
    { name = "keyclicker", email = "nick@keyclicker.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "openai>=2.52.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
libertati = "libertati:main"
libertati-spy = "libertati.spy:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D"]
pydocstyle.convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "rich>=15.0.0",
    "ruff>=0.16.1",
    "textual>=8.2.8",
    "ty>=0.0.65",
]
