[project]
name = "libertati"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "keyclicker", email = "nick@keyclicker.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "openai>=2.52.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
libertati = "libertati:main"
libertati-ctx = "libertati.ctxtail:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D"]
pydocstyle.convention = "google"

[dependency-groups]
dev = [
    "rich>=15.0.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]
